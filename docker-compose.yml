services:
  apec-global:
    container_name: apec-global
    image: apec-global
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env
      
    ports:
     - "3023:3023"
     
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads:rw
      
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3023"]
      interval: 30s
      timeout: 5s
      retries: 3